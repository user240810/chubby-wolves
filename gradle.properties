# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric Properties
# !! IMPORTANT !!
# 1.21.11 is EXTREMELY recent (it's the last obfuscated Minecraft release before
# Mojang's unobfuscation switch). Dependency versions for it move fast, so treat
# the numbers below as a starting point, not gospel:
#   1. Go to https://fabricmc.net/develop/
#   2. Select Minecraft version 1.21.11
#   3. Copy the exact loader_version, loom_version and fabric_version it shows
#      into the fields below before you build.
minecraft_version=1.21.11
loader_version=0.18.1
loom_version=1.14-SNAPSHOT
fabric_version=CHECK_FABRICMC_NET_DEVELOP

# Mod Properties
mod_version=1.0.0
maven_group=com.chubbywolves
archives_base_name=chubby-wolves
