plugins {
	// 1.21.11 is still an obfuscated release, so it uses the "remap" flavor of Loom.
	// !! Check https://fabricmc.net/develop/ and update loom_version in gradle.properties
	//    if this fails to resolve — Loom releases very frequently. !!
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom adds the Minecraft/Fabric maven repos automatically.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"chubbywolves" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	// 1.21.11 is the last obfuscated version, and Yarn stops there — so we use
	// Mojang's own official mappings instead (this is what Fabric recommends now).
	mappings loom.officialMojangMappings()

	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}
